name: studio-b64-decode
# 暫時性 workflow：把 _b64/studio.b64.* 解碼為 index.html（教學中心新增「新生必學：心智圖 × IPO」卡片），md5 驗證後自我清理。
on:
  push:
    paths: ["_b64/DONE"]
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode & verify
        run: |
          set -e
          [ -f _b64/DONE ] || { echo "no DONE marker, skip"; exit 0; }
          cat _b64/studio.b64.* | base64 -d > index.html
          echo "2a6d1630013a6f6689a4b3f34de9cf7f  index.html" | md5sum -c -
          rm -rf _b64
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "教學中心新增「🧠 新生必學：心智圖 × IPO（運算思維基礎能力）」卡片，連回 Hub 單元教材與練習單（base64 解碼、md5 驗證）[skip ci]"
          git push
