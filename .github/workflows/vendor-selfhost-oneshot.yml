name: vendor-selfhost-oneshot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build vendor libraries from npm registry (exact versions)
        run: |
          set -e
          mkdir -p vendor _pk
          cd _pk
          for p in pptxgenjs@3.12.0 xlsx@0.18.5 jszip@3.10.1 jspdf@2.5.1 jspdf-autotable@3.8.2 html2canvas@1.4.1 docx@8.5.0 mermaid@10.9.1 chart.js@4.4.4; do npm pack "$p" --silent; done
          tar xzf pptxgenjs-3.12.0.tgz package/dist/pptxgen.bundle.js -O > ../vendor/pptxgen.bundle.js
          tar xzf xlsx-0.18.5.tgz package/dist/xlsx.full.min.js -O > ../vendor/xlsx.full.min.js
          tar xzf jszip-3.10.1.tgz package/dist/jszip.min.js -O > ../vendor/jszip.min.js
          tar xzf jspdf-2.5.1.tgz package/dist/jspdf.umd.min.js -O > ../vendor/jspdf.umd.min.js
          tar xzf jspdf-2.5.1.tgz package/dist/polyfills.umd.js -O > ../vendor/polyfills.umd.min.js
          tar xzf jspdf-autotable-3.8.2.tgz package/dist/jspdf.plugin.autotable.min.js -O > ../vendor/jspdf.plugin.autotable.min.js
          tar xzf html2canvas-1.4.1.tgz package/dist/html2canvas.min.js -O > ../vendor/html2canvas.min.js
          tar xzf docx-8.5.0.tgz package/build/index.umd.js -O > ../vendor/docx.umd.min.js
          tar xzf mermaid-10.9.1.tgz package/dist/mermaid.min.js -O > ../vendor/mermaid.min.js
          tar xzf chart.js-4.4.4.tgz package/dist/chart.umd.js -O > ../vendor/chart.umd.min.js
          npm init -y >/dev/null
          npm i --no-save qrcode@1.5.3 esbuild@0.23.1 >/dev/null 2>&1
          npx esbuild --bundle --format=iife --global-name=QRCode --minify node_modules/qrcode/lib/browser.js > ../vendor/qrcode.min.js
          cd ..
          rm -rf _pk
          for f in pptxgen.bundle.js xlsx.full.min.js jszip.min.js jspdf.umd.min.js polyfills.umd.min.js jspdf.plugin.autotable.min.js html2canvas.min.js docx.umd.min.js qrcode.min.js mermaid.min.js chart.umd.min.js; do test -s "vendor/$f" || { echo "MISSING vendor/$f"; exit 1; }; done
          ls -la vendor/
      - name: Rewrite index.html CDN URLs to vendor/
        run: |
          python3 - <<'PYEOF'
          M = {
            "https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js": "vendor/pptxgen.bundle.js",
            "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js": "vendor/xlsx.full.min.js",
            "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js": "vendor/jszip.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js": "vendor/jspdf.umd.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/polyfills.umd.min.js": "vendor/polyfills.umd.min.js",
            "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js": "vendor/jspdf.plugin.autotable.min.js",
            "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js": "vendor/html2canvas.min.js",
            "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js": "vendor/docx.umd.min.js",
            "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js": "vendor/qrcode.min.js",
            "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js": "vendor/mermaid.min.js",
            "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js": "vendor/chart.umd.min.js",
          }
          s = open('index.html', encoding='utf-8').read()
          if 'vendor/mermaid.min.js' in s:
              print('already rewritten, skip')
          else:
              for k, v in M.items():
                  assert s.count(k) == 1, (k, s.count(k))
                  s = s.replace(k, v)
              open('index.html', 'w', encoding='utf-8').write(s)
              print('index.html rewritten')
          PYEOF
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/vendor-selfhost-oneshot.yml
          git add -A
          git commit -m "perf: self-host 11 CDN libraries in vendor/, rewrite index.html script srcs" -m "單一來源(GitHub Pages/Fastly,50 併發已驗證),消除 jsdelivr/cdnjs 第三方風險;Pyodide 仍走 CDN。One-shot workflow self-removed." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01Lrs7dXC4mxdS82MGrZ2SGU"
          git push
